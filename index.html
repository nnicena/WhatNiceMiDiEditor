<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIY Foot Switch MIDI Editor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { text-align: center; color: #00adb5; }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #eeeeee;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #393e46;
            background-color: #393e46;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #00adb5;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #007a80; }
        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            background-color: #393e46;
            font-size: 14px;
        }
        .log-box {
            margin-top: 20px;
            background-color: #111;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
            color: #39ff14;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>What Nice MIDI Editor</h1>
    
    <!-- ส่วนเชื่อมต่ออุปกรณ์ -->
    <div class="form-group">
        <label for="midi-outputs">เลือกอุปกรณ์ฟุตสวิตช์ (MIDI Output):</label>
        <select id="midi-outputs">
            <option value="">-- กรุณาเลือกอุปกรณ์ --</option>
        </select>
    </div>

    <hr style="border: 0; border-top: 1px solid #393e46; margin: 25px 0;">

    <!-- ส่วนตั้งค่าปุ่ม -->
    <div class="form-group">
        <label for="switch-select">เลือกปุ่มสวิตช์ที่ต้องการตั้งค่า:</label>
        <select id="switch-select">
            <option value="1">Switch A (ปุ่มที่ 1)</option>
            <option value="2">Switch B (ปุ่มที่ 2)</option>
            <option value="3">Switch C (ปุ่มที่ 3)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="msg-type">ประเภทข้อความ MIDI (Message Type):</label>
        <select id="msg-type">
            <option value="176">Control Change (CC)</option>
            <option value="192">Program Change (PC)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="midi-number">หมายเลข (Number / CC#):</label>
        <input type="number" id="midi-number" min="0" max="127" value="10">
    </div>

    <div class="form-group">
        <label for="midi-value">ค่าของข้อมูล (Value):</label>
        <input type="number" id="midi-value" min="0" max="127" value="127">
    </div>

    <button id="btn-save">ส่งการตั้งค่าไปยังฟุตสวิตช์ (Save to Device)</button>

    <div id="status">กำลังตรวจสอบระบบ Web MIDI...</div>
    
    <div class="log-box" id="log-box">>> Log Console Ready...</div>
</div>

<script>
    let midiAccess = null;
    let selectedOutput = null;

    const statusDiv = document.getElementById('status');
    const outputSelect = document.getElementById('midi-outputs');
    const logBox = document.getElementById('log-box');

    function log(message) {
        logBox.innerHTML += `<br>>> ${message}`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    // 1. ขอสิทธิ์เข้าถึง Web MIDI API จาก Browser
    if (navigator.requestMIDIAccess) {
        navigator.requestMIDIAccess({ sysex: true }) // เปิดใช้งาน sysex สำหรับโอนย้ายข้อมูล
            .then(onMIDISuccess, onMIDIFailure);
    } else {
        statusDiv.style.backgroundColor = "#ff4d4d";
        statusDiv.innerText = "เบราว์เซอร์นี้ไม่รองรับ Web MIDI API (แนะนำให้ใช้ Chrome หรือ Edge)";
    }

    function onMIDISuccess(midi) {
        midiAccess = midi;
        statusDiv.style.backgroundColor = "#28a745";
        statusDiv.innerText = "ระบบ MIDI พร้อมใช้งาน! กรุณาเลือกอุปกรณ์";
        log("เข้าถึง Web MIDI API สำเร็จ (เปิดโหมด SysEx แล้ว)");
        
        updateMIDIDevices();
        // ตรวจจับกรณีมีการดึงสายหรือเสียบสายอุปกรณ์ใหม่
        midiAccess.onstatechange = updateMIDIDevices;
    }

    function onMIDIFailure(error) {
        statusDiv.style.backgroundColor = "#ff4d4d";
        statusDiv.innerText = "ปฏิเสธการเข้าถึงระบบ MIDI: " + error;
    }

    // 2. อัปเดตรายชื่อพอร์ตอุปกรณ์ที่เชื่อมต่ออยู่เข้ามาใน Dropdown
    function updateMIDIDevices() {
        outputSelect.innerHTML = '<option value="">-- กรุณาเลือกอุปกรณ์ --</option>';
        const outputs = midiAccess.outputs;

        if(outputs.size === 0) {
            log("ไม่พบอุปกรณ์ MIDI เชื่อมต่ออยู่");
            return;
        }

        outputs.forEach((output) => {
            const option = document.createElement('option');
            option.value = output.id;
            option.innerText = output.name;
            outputSelect.appendChild(option);
        });
    }

    // ดักจับการเลือกอุปกรณ์
    outputSelect.addEventListener('change', (e) => {
        const id = e.target.value;
        if(id) {
            selectedOutput = midiAccess.outputs.get(id);
            log(`เลือกอุปกรณ์ส่งออก: ${selectedOutput.name}`);
        } else {
            selectedOutput = null;
        }
    });

    // 3. ส่งข้อมูล SysEx เมื่อกดปุ่ม Save
    document.getElementById('btn-save').addEventListener('click', () => {
        if (!selectedOutput) {
            alert('กรุณาเลือกอุปกรณ์ MIDI ก่อนครับ!');
            return;
        }

        // ดึงค่าต่างๆ จากหน้าเว็บ UI
        const switchNum = parseInt(document.getElementById('switch-select').value);
        const msgType = parseInt(document.getElementById('msg-type').value);
        const midiNum = parseInt(document.getElementById('midi-number').value);
        const midiVal = parseInt(document.getElementById('midi-value').value);

        /* 
           สร้างโครงสร้างชุดข้อความจำลองขึ้นมา (Byte Array SysEx)
           0xF0 = จุดเริ่มต้นข้อความ SysEx
           0x7D = รหัสผู้ผลิต (Manufacturer ID สำหรับงาน DIY / วิจัย)
           [ข้อมูลการตั้งค่าที่เราส่งไป]
           0xF7 = จุดสิ้นสุดข้อความ SysEx
        */
        const sysexData = [
            0xF0,       // Start SysEx
            0x7D,       // Educational/DIY ID
            switchNum,  // ปุ่มที่เท่าไหร่ (1, 2, 3)
            msgType,    // ประเภทข้อความ (176=CC, 192=PC)
            midiNum,    // เลขข้อความ (0-127)
            midiVal,    // ค่าความแรง (0-127)
            0xF7        // End SysEx
        ];

        try {
            // สั่งให้เว็บแอปพลิเคชันยิงข้อมูลดิบออกไปทางสาย USB ทันที
            selectedOutput.send(sysexData);
            log(`ส่งคำสั่งเซฟปุ่ม ${switchNum} สำเร็จ -> ชุดข้อมูลบิต: [${sysexData.map(x => '0x' + x.toString(16).toUpperCase()).join(', ')}]`);
            alert('ส่งข้อมูลโครงสร้างปุ่มไปยังฟุตสวิตช์เรียบร้อยแล้ว!');
        } catch (error) {
            log(`เกิดข้อผิดพลาดในการส่งข้อมูล: ${error}`);
            alert('ไม่สามารถส่งข้อมูลได้ กรุณาตรวจสอบการเชื่อมต่อ');
        }
    });
</script>

</body>
</html>
