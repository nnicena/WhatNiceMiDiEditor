<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>What Nice MIDI Editor</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    color: #222;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

h1 {
    margin: 0;
}

button {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 14px;
}

.primary {
    background: #111;
    color: white;
}

.secondary {
    background: white;
    border: 1px solid #ccc;
}

.layout {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 15px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 18px;
    border: 1px solid #ddd;
}

.bank-button {
    width: 100%;
    margin-top: 8px;
    text-align: left;
}

.bank-button.active {
    background: #111;
    color: white;
}

.switches {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.switch {
    background: white;
    border: 2px solid #ddd;
    border-radius: 10px;
    padding: 18px;
    text-align: left;
}

.switch.active {
    border-color: #111;
}

.switch-name {
    font-size: 20px;
    font-weight: bold;
}

.form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 15px;
}

label {
    font-size: 13px;
}

input,
select {
    width: 100%;
    margin-top: 5px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 18px;
}

.lcd {
    background: #dce8d2;
    border: 3px solid #555;
    border-radius: 6px;
    padding: 15px;
    margin-top: 10px;

    font-family: monospace;
    font-size: 22px;

    white-space: pre;
    letter-spacing: 1px;
}

.status {
    margin-top: 10px;
    color: #777;
}

@media(max-width:700px) {

    .layout {
        grid-template-columns: 1fr;
    }

    .switches {
        grid-template-columns: repeat(2, 1fr);
    }

    .form {
        grid-template-columns: 1fr;
    }

}

</style>
</head>

<body>

<div class="container">

<header>

<div>
<h1>What Nice MIDI Editor</h1>
<div>6 Switch MIDI Foot Controller</div>
</div>

<button class="primary" onclick="saveSettings()">
Save
</button>

</header>


<div class="layout">


<!-- BANKS -->

<div class="card">

<h3>BANKS</h3>

<div id="banks"></div>

<button
class="secondary"
style="width:100%;margin-top:10px"
onclick="addBank()">

+ Add Bank

</button>

</div>


<!-- MAIN -->

<div>


<!-- BANK -->

<div class="card">

<h2 id="bankTitle">
BANK 01
</h2>

<div
class="switches"
id="switches">
</div>

</div>


<!-- EDITOR -->

<div
class="card"
style="margin-top:15px">

<h3 id="selectedSwitch">
FS1
</h3>


<div class="form">


<div>

<label>
Short Name
</label>

<input
id="shortName"
maxlength="8">

</div>


<div>

<label>
Long Name
</label>

<input
id="longName"
maxlength="24">

</div>


<div>

<label>
LCD Column (0-23)
</label>

<input
id="lcdColumn"
type="number"
min="0"
max="23">

</div>


<div>

<label>
LCD Row
</label>

<select id="lcdRow">

<option value="0">
Row 1
</option>

<option value="1">
Row 2
</option>

</select>

</div>


<div>

<label>
Action
</label>

<select id="action">

<option>Press</option>
<option>Release</option>
<option>Long Press</option>
<option>Double Tap</option>

</select>

</div>


<div>

<label>
MIDI Type
</label>

<select id="midiType">

<option>CC</option>
<option>PC</option>
<option>Note</option>
<option>Clock</option>

</select>

</div>


<div>

<label>
MIDI Channel
</label>

<input
id="channel"
type="number"
min="1"
max="16">

</div>


<div>

<label>
Number / Note
</label>

<input
id="number"
type="number"
min="0"
max="127">

</div>


<div>

<label>
Value
</label>

<input
id="value"
type="number"
min="0"
max="127">

</div>

</div>


<div class="actions">

<button
class="primary"
onclick="applySettings()">

Apply

</button>


<button
class="secondary"
onclick="copySwitch()">

Copy

</button>


<button
class="secondary"
onclick="pasteSwitch()">

Paste

</button>


<button
class="secondary"
onclick="exportJSON()">

Export JSON

</button>


<button
class="secondary"
onclick="document.getElementById('importFile').click()">

Import JSON

</button>

<input
type="file"
id="importFile"
accept=".json"
style="display:none"
onchange="importJSON(event)">

</div>

</div>


<!-- LCD -->

<div
class="card"
style="margin-top:15px">

<h3>LCD 24 × 2</h3>

<div
class="lcd"
id="lcd">
</div>

</div>


<!-- ESP32 -->

<div
class="card"
style="margin-top:15px">

<h3>ESP32</h3>

<div class="actions">

<button
class="primary"
onclick="connectESP32()">

Connect ESP32

</button>


<button
class="secondary"
onclick="sendToESP32()">

Send Settings

</button>


<button
class="secondary"
onclick="readFromESP32()">

Read Settings

</button>

</div>

<div
class="status"
id="status">

ESP32: Not Connected

</div>

</div>


</div>

</div>

</div>


<script>


/* =========================
   DATA
========================= */

let banks = [];

let currentBank = 0;

let currentSwitch = 0;

let clipboard = null;

let serialPort = null;


/* =========================
   CREATE SWITCH
========================= */

function createSwitch(index) {

    const names = [
        "DIST",
        "DELAY",
        "REVERB",
        "SOLO",
        "CHORUS",
        "TAP"
    ];

    return {

        shortName: names[index],

        longName: names[index],

        column: [0,8,16,0,8,16][index],

        row: index < 3 ? 0 : 1,

        action: "Press",

        midiType: "CC",

        channel: 1,

        number: 20 + index,

        value: 127

    };

}


/* =========================
   CREATE BANK
========================= */

function createBank(name) {

    return {

        name: name,

        switches: [

            createSwitch(0),
            createSwitch(1),
            createSwitch(2),
            createSwitch(3),
            createSwitch(4),
            createSwitch(5)

        ]

    };

}


/* =========================
   INITIAL DATA
========================= */

banks.push(
    createBank("BANK 01")
);

banks.push(
    createBank("BANK 02")
);


/* =========================
   RENDER
========================= */

function render() {

    renderBanks();

    renderSwitches();

    loadEditor();

    renderLCD();

}


/* =========================
   BANKS
========================= */

function renderBanks() {

    const container =
        document.getElementById("banks");

    container.innerHTML = "";

    banks.forEach((bank,index)=>{

        const button =
            document.createElement("button");

        button.className =
            "bank-button " +
            (index === currentBank
                ? "active"
                : "");

        button.textContent =
            bank.name;

        button.onclick = ()=>{

            currentBank = index;

            currentSwitch = 0;

            render();

        };

        container.appendChild(button);

    });

}


/* =========================
   SWITCHES
========================= */

function renderSwitches() {

    const container =
        document.getElementById("switches");

    container.innerHTML = "";

    const switches =
        banks[currentBank].switches;

    switches.forEach((sw,index)=>{

        const button =
            document.createElement("button");

        button.className =
            "switch " +
            (index === currentSwitch
                ? "active"
                : "");

        button.innerHTML = `

            <div>FS${index+1}</div>

            <div class="switch-name">
                ${sw.shortName}
            </div>

            <small>
                ${sw.midiType}
                ${sw.number}
            </small>

        `;

        button.onclick = ()=>{

            currentSwitch = index;

            render();

        };

        container.appendChild(button);

    });

}


/* =========================
   LOAD EDITOR
========================= */

function loadEditor() {

    const sw =
        banks[currentBank]
        .switches[currentSwitch];


    document.getElementById(
        "selectedSwitch"
    ).textContent =
        "FS" + (currentSwitch + 1);


    document.getElementById(
        "shortName"
    ).value =
        sw.shortName;


    document.getElementById(
        "longName"
    ).value =
        sw.longName;


    document.getElementById(
        "lcdColumn"
    ).value =
        sw.column;


    document.getElementById(
        "lcdRow"
    ).value =
        sw.row;


    document.getElementById(
        "action"
    ).value =
        sw.action;


    document.getElementById(
        "midiType"
    ).value =
        sw.midiType;


    document.getElementById(
        "channel"
    ).value =
        sw.channel;


    document.getElementById(
        "number"
    ).value =
        sw.number;


    document.getElementById(
        "value"
    ).value =
        sw.value;

}


/* =========================
   APPLY
========================= */

function applySettings() {

    const sw =
        banks[currentBank]
        .switches[currentSwitch];


    sw.shortName =
        document.getElementById(
            "shortName"
        ).value;


    sw.longName =
        document.getElementById(
            "longName"
        ).value;


    sw.column =
        Number(
            document.getElementById(
                "lcdColumn"
            ).value
        );


    sw.row =
        Number(
            document.getElementById(
                "lcdRow"
            ).value
        );


    sw.action =
        document.getElementById(
            "action"
        ).value;


    sw.midiType =
        document.getElementById(
            "midiType"
        ).value;


    sw.channel =
        Number(
            document.getElementById(
                "channel"
            ).value
        );


    sw.number =
        Number(
            document.getElementById(
                "number"
            ).value
        );


    sw.value =
        Number(
            document.getElementById(
                "value"
            ).value
        );


    render();

    setStatus(
        "Settings applied"
    );

}


/* =========================
   LCD
========================= */

function renderLCD() {

    let row1 =
        "                        ";

    let row2 =
        "                        ";


    banks[currentBank]
    .switches
    .forEach(sw=>{

        let text =
            sw.shortName.substring(
                0,8
            );


        let column =
            Math.max(
                0,
                Math.min(
                    23 - text.length,
                    sw.column
                )
            );


        if(sw.row === 0) {

            row1 =
                row1.substring(
                    0,column
                )
                +
                text
                +
                row1.substring(
                    column + text.length
                );

        } else {

            row2 =
                row2.substring(
                    0,column
                )
                +
                text
                +
                row2.substring(
                    column + text.length
                );

        }

    });


    document.getElementById(
        "lcd"
    ).textContent =
        row1 + "\n" + row2;

}


/* =========================
   ADD BANK
========================= */

function addBank() {

    const number =
        banks.length + 1;

    banks.push(
        createBank(
            "BANK " +
            String(number)
            .padStart(2,"0")
        )
    );

    currentBank =
        banks.length - 1;

    currentSwitch = 0;

    render();

}


/* =========================
   COPY
========================= */

function copySwitch() {

    clipboard =
        JSON.parse(
            JSON.stringify(
                banks[currentBank]
                .switches[currentSwitch]
            )
        );

    setStatus(
        "FS copied"
    );

}


/* =========================
   PASTE
========================= */

function pasteSwitch() {

    if(!clipboard)
        return;


    banks[currentBank]
    .switches[currentSwitch] =
        JSON.parse(
            JSON.stringify(
                clipboard
            )
        );


    render();

    setStatus(
        "FS pasted"
    );

}


/* =========================
   SAVE
========================= */

function saveSettings() {

    localStorage.setItem(
        "niceMidiSettings",
        JSON.stringify(banks)
    );

    setStatus(
        "Saved to browser"
    );

}


/* =========================
   EXPORT
========================= */

function exportJSON() {

    const data =
        JSON.stringify(
            banks,
            null,
            2
        );


    const blob =
        new Blob(
            [data],
            {
                type:
                "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href = url;

    a.download =
        "nice-midi-settings.json";

    a.click();

    URL.revokeObjectURL(url);

}


/* =========================
   IMPORT
========================= */

function importJSON(event) {

    const file =
        event.target.files[0];


    const reader =
        new FileReader();


    reader.onload =
        function(){

            try {

                banks =
                    JSON.parse(
                        reader.result
                    );

                currentBank = 0;

                currentSwitch = 0;

                render();

                setStatus(
                    "Import successful"
                );

            }

            catch {

                setStatus(
                    "Invalid JSON"
                );

            }

        };


    reader.readAsText(file);

}


/* =========================
   ESP32 CONNECT
========================= */

async function connectESP32() {

    if(!("serial" in navigator)) {

        setStatus(
            "Web Serial ไม่รองรับใน browser นี้"
        );

        return;

    }


    try {

        serialPort =
            await navigator.serial
            .requestPort();


        await serialPort.open({
            baudRate: 115200
        });


        setStatus(
            "ESP32 Connected"
        );

    }

    catch(error) {

        console.error(error);

        setStatus(
            "ESP32 connection failed"
        );

    }

}


/* =========================
   SEND TO ESP32
========================= */

async function sendToESP32() {

    if(!serialPort) {

        setStatus(
            "Connect ESP32 ก่อน"
        );

        return;

    }


    const data =
        JSON.stringify(banks);


    const writer =
        serialPort.writable
        .getWriter();


    const encoder =
        new TextEncoder();


    await writer.write(
        encoder.encode(
            data + "\n"
        )
    );


    writer.releaseLock();


    setStatus(
        "Settings sent to ESP32"
    );

}


/* =========================
   READ ESP32
========================= */

async function readFromESP32() {

    if(!serialPort) {

        setStatus(
            "Connect ESP32 ก่อน"
        );

        return;

    }


    const reader =
        serialPort.readable
        .getReader();


    try {

        const {
            value,
            done
        } =
        await reader.read();


        if(done)
            return;


        const text =
            new TextDecoder()
            .decode(value);


        console.log(
            "ESP32:",
            text
        );


        try {

            banks =
                JSON.parse(text);

            currentBank = 0;

            currentSwitch = 0;

            render();

            setStatus(
                "Settings received"
            );

        }

        catch {

            setStatus(
                "Received data is not JSON"
            );

        }

    }

    finally {

        reader.releaseLock();

    }

}


/* =========================
   STATUS
========================= */

function setStatus(text) {

    document.getElementById(
        "status"
    ).textContent =
        text;

}


/* =========================
   LOAD SAVED DATA
========================= */

const saved =
    localStorage.getItem(
        "WhatniceMidiSettings"
    );


if(saved) {

    try {

        banks =
            JSON.parse(saved);

    }

    catch {}

}


/* =========================
   START
========================= */

render();

</script>

</body>
</html>
